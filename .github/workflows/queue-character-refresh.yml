name: Queue Character Refresh

on:
  schedule:
    # Check every 10 minutes. Persisted state enforces >=10 minutes after the
    # previous batch's last response, even for delayed/manual/rerun jobs.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the next eligible batch without sending requests or writing state.'
        required: false
        type: boolean
        default: false
      initialize_state:
        description: 'First setup only: allow creation of the dedicated state branch.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: queue-character-refresh
  cancel-in-progress: false

jobs:
  queue-refresh:
    # Do not let a manual dispatch from another code branch share live state.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Needed only to persist state on character-refresh-state. The script
      # never commits/pushes the report/code branch or dispatches another run.
      contents: write

    steps:
      - name: Checkout current default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Test bounded refresh batches (mocked HTTP)
        run: python -m unittest test_queue_character_refresh.py

      - name: Queue at most 3 characters from 빅딜 and 셀린느
        env:
          REFRESH_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          REFRESH_INITIALIZE_STATE: ${{ github.event.inputs.initialize_state || 'false' }}
        run: |
          args=(
            --guild '빅딜'
            --guild '셀린느'
            --state-branch character-refresh-state
          )
          if [ "$REFRESH_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$REFRESH_INITIALIZE_STATE" = "true" ]; then
            args+=(--initialize-state)
          fi
          python queue_character_refresh.py "${args[@]}"
